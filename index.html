<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>NSQF Planner – Samagra Shiksha Assam</title>

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" media="(prefers-color-scheme:light)" content="#0F2440">
    <meta name="theme-color" media="(prefers-color-scheme:dark)"  content="#0a1628">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NSQF Planner">
    <link rel="apple-touch-icon" href="Icon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #F4F2ED;   /* matches the app's --paper */
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #appFrame {
            border: 0;
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: #F4F2ED;
        }

        /* ========== LOADING OVERLAY ========== */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 9999;
            background: linear-gradient(160deg, #FAF8F4 0%, #EFEDE6 50%, #F4F2ED 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: opacity, visibility;
        }

        #loadingOverlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* --- modern dual-ring spinner --- */
        .spinner-container {
            position: relative;
            width: 64px;
            height: 64px;
            margin-bottom: 32px;
        }

        .spinner-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2.5px solid transparent;
            animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .spinner-ring.outer {
            border-top-color: #1a3d6d;
            border-right-color: #1a3d6d;
            border-bottom-color: transparent;
            border-left-color: transparent;
            animation-duration: 1.2s;
        }

        .spinner-ring.inner {
            inset: 8px;
            border-top-color: transparent;
            border-right-color: transparent;
            border-bottom-color: #b3c7e0;
            border-left-color: #b3c7e0;
            animation-duration: 0.8s;
            animation-direction: reverse;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* --- modern typography --- */
        .main-text {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1a1f2e;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
            text-align: center;
            padding: 0 20px;
        }

        .sub-text {
            font-size: 0.85rem;
            font-weight: 400;
            color: #8b91a0;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            text-align: center;
            padding: 0 20px;
            min-height: 1.4em;
            transition: color 0.3s ease;
            margin-bottom: 18px;
        }

        /* --- modern progress bar --- */
        .progress-wrapper {
            width: min(300px, 72vw);
            margin-top: 8px;
        }

        .progress-track {
            width: 100%;
            height: 3px;
            background-color: #e2e0db;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #1a3d6d, #4a7ab5);
            border-radius: 10px;
            transition: width 0.1s linear;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 20px;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            filter: blur(1px);
        }

        .progress-percent {
            text-align: right;
            font-size: 0.7rem;
            color: #a0a5b0;
            margin-top: 6px;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        /* --- retry button --- */
        .retry-btn {
            margin-top: 18px;
            padding: 10px 28px;
            background: transparent;
            border: 1.5px solid #c5cbd8;
            border-radius: 50px;
            color: #1a3d6d;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .retry-btn.visible {
            opacity: 1;
            visibility: visible;
        }

        .retry-btn:hover {
            border-color: #1a3d6d;
            background: rgba(26, 61, 109, 0.06);
        }

        .retry-btn:active {
            transform: scale(0.96);
        }

        /* --- subtle shimmer background accent --- */
        .bg-accent {
            position: absolute;
            top: -30%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(26, 61, 109, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%,
            100% {
                opacity: 0.5;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 0.8;
                transform: translateX(-50%) scale(1.05);
            }
        }

        /* --- fallback for very small screens --- */
        @media (max-width: 480px) {
            .spinner-container {
                width: 52px;
                height: 52px;
                margin-bottom: 24px;
            }
            .main-text {
                font-size: 1.05rem;
            }
            .sub-text {
                font-size: 0.75rem;
                letter-spacing: 1px;
            }
            .progress-wrapper {
                width: min(240px, 78vw);
            }
        }

        @media (max-width: 360px) {
            .spinner-container {
                width: 44px;
                height: 44px;
                margin-bottom: 18px;
            }
            .main-text {
                font-size: 0.95rem;
            }
            .sub-text {
                font-size: 0.7rem;
                letter-spacing: 0.8px;
            }
        }

        /* ========== DOWNLOAD NOTES BUTTON (floating, always visible) ========== */
        #notesBtn {
            position: fixed;
            /* sits just above the app's bottom nav bar; safe-area aware */
            bottom: calc(84px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 16px 9px 12px;
            border-radius: 50px;
            border: 1px solid rgba(26, 61, 109, 0.18);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #1a3d6d;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 16px rgba(15, 36, 64, 0.14);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.3s ease;
        }

        #notesBtn svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        #notesBtn:hover {
            box-shadow: 0 6px 20px rgba(15, 36, 64, 0.2);
            transform: translateX(-50%) translateY(-1px);
        }

        #notesBtn:active {
            transform: translateX(-50%) scale(0.97);
        }

        /* Reserved for future use — kept for compatibility with existing JS */
        #notesBtn.hidden {
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            #notesBtn {
                padding: 8px 14px 8px 11px;
                font-size: 0.72rem;
                bottom: calc(80px + env(safe-area-inset-bottom, 0px));
            }
        }

        /* ========== DARK MODE ========== */
        /* The wrapper can't detect the app's own theme (cross-origin iframe),
           but the app's pre-paint script uses prefers-color-scheme, so these
           rules stay visually in sync ~95% of the time. */
        @media (prefers-color-scheme: dark) {
            html, body {
                background: #080c17;
            }

            #appFrame {
                background: #080c17;
            }

            #loadingOverlay {
                background: linear-gradient(160deg, #0c1220 0%, #0a0f1c 50%, #080c17 100%);
            }

            .spinner-ring.outer {
                border-top-color: #4a7ab5;
                border-right-color: #4a7ab5;
            }

            .spinner-ring.inner {
                border-bottom-color: #2a3350;
                border-left-color: #2a3350;
            }

            .main-text {
                color: #e6eaf2;
            }

            .sub-text {
                color: #94a0b8;
            }

            .progress-track {
                background-color: #1e2740;
            }

            .progress-fill {
                background: linear-gradient(90deg, #4a7ab5, #7aa2ff);
            }

            .progress-percent {
                color: #5a6580;
            }

            .retry-btn {
                color: #8fb8e8;
                border-color: #2a3350;
            }

            .retry-btn:hover {
                border-color: #8fb8e8;
                background: rgba(143, 184, 232, 0.08);
            }

            .bg-accent {
                background: radial-gradient(circle, rgba(74, 122, 181, 0.14) 0%, transparent 70%);
            }

            #notesBtn {
                background: rgba(16, 24, 39, 0.92);
                border-color: rgba(255, 255, 255, 0.09);
                color: #e6eaf2;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            }

            #notesBtn:hover {
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
            }
        }
    </style>
</head>
<body>

    <!-- Loading overlay – modern & natural -->
    <div id="loadingOverlay" aria-live="polite">
        <div class="bg-accent"></div>

        <div class="spinner-container">
            <div class="spinner-ring outer"></div>
            <div class="spinner-ring inner"></div>
        </div>

        <div class="main-text" id="mainText">Connecting with Server</div>
        <div class="sub-text" id="subText">Please wait</div>

        <div class="progress-wrapper">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-percent" id="progressPercent">0%</div>
        </div>

        <button class="retry-btn" id="retryBtn">Retry Connection</button>
    </div>

    <!-- Main iframe -->
    <iframe
        id="appFrame"
        src="https://script.google.com/macros/s/AKfycbwCb1FwCRwwvR7neVuYlC2-8ZgLVSlhVt_wxPH8Syzc80jzjjiGZ48KdTykVVFciwRcwA/exec"
        allow="clipboard-read; clipboard-write; fullscreen; geolocation"
        referrerpolicy="no-referrer"
        title="NSQF Planner Application"
    ></iframe>

    <!-- Download Notes button (floating, always visible) -->
    <button id="notesBtn" aria-label="Download Notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download Notes</span>
    </button>

    <script>
        (function() {
            // ---------- Configuration ----------
            const MIN_LOADING_TIME = 1200;          // ms (minimum overlay display)
            const MESSAGE_INTERVAL = 900;           // ms between status changes
            const IFRAME_TIMEOUT = 15000;           // ms before showing retry
            const FADE_DURATION = 600;              // must match CSS transition
            const NOTES_URL = "https://hjkhan015-star.github.io/NotesNSQF/index.html";

            // Modern status message pairs
            const STATUS_PAIRS = [
                { main: 'Connecting with Server', sub: 'Please wait' },
                { main: 'Initializing', sub: 'Setting up secure session' },
                { main: 'Loading Dashboard', sub: 'Almost ready' },
                { main: 'Verifying', sub: 'Checking connection' },
            ];

            // ---------- DOM Elements ----------
            const overlay = document.getElementById('loadingOverlay');
            const mainText = document.getElementById('mainText');
            const subText = document.getElementById('subText');
            const progressFill = document.getElementById('progressFill');
            const progressPercent = document.getElementById('progressPercent');
            const retryBtn = document.getElementById('retryBtn');
            const iframe = document.getElementById('appFrame');
            const notesBtn = document.getElementById('notesBtn');

            // ---------- State ----------
            let iframeLoaded = false;
            let minTimeElapsed = false;
            let accessGranted = false;
            let statusIndex = 0;
            let statusTimer = null;
            let timeoutTimer = null;
            let progressStart = Date.now();
            let progressRAF = null;

            // ---------- Progress updater ----------
            function updateProgress() {
                const elapsed = Date.now() - progressStart;
                const raw = Math.min(elapsed / MIN_LOADING_TIME, 1);
                const eased = 1 - Math.pow(1 - raw, 1.5); // slightly smoother ease
                const percent = Math.min(Math.round(eased * 100), 100);

                progressFill.style.width = percent + '%';
                progressPercent.textContent = percent + '%';

                if (raw < 1 && !accessGranted) {
                    progressRAF = requestAnimationFrame(updateProgress);
                }
            }
            progressRAF = requestAnimationFrame(updateProgress);

            // ---------- Status text updater ----------
            function setStatus(main, sub) {
                mainText.textContent = main;
                subText.textContent = sub;
            }

            function cycleStatus() {
                statusIndex = (statusIndex + 1) % STATUS_PAIRS.length;
                setStatus(STATUS_PAIRS[statusIndex].main, STATUS_PAIRS[statusIndex].sub);
            }

            statusTimer = setInterval(cycleStatus, MESSAGE_INTERVAL);

            // ---------- Minimum time tracker ----------
            const minTimer = setTimeout(() => {
                minTimeElapsed = true;
                checkReady();
            }, MIN_LOADING_TIME);

            // ---------- Iframe load detection ----------
            iframe.addEventListener('load', () => {
                if (!iframeLoaded) {
                    iframeLoaded = true;
                    console.log('[NSQF] Iframe loaded.');
                    checkReady();
                }
            });

            // ---------- Timeout / retry ----------
            function handleTimeout() {
                if (!iframeLoaded && !accessGranted) {
                    setStatus('Taking longer than expected', 'Please hold on');
                    retryBtn.classList.add('visible');
                    clearInterval(statusTimer);
                }
            }
            timeoutTimer = setTimeout(handleTimeout, IFRAME_TIMEOUT);

            retryBtn.addEventListener('click', () => {
                retryBtn.classList.remove('visible');
                setStatus('Reconnecting', 'Please wait');

                // Reset state
                iframeLoaded = false;
                accessGranted = false;
                minTimeElapsed = false;
                progressStart = Date.now();
                progressFill.style.width = '0%';
                progressPercent.textContent = '0%';

                // Restart status cycling
                clearInterval(statusTimer);
                statusIndex = 0;
                setStatus(STATUS_PAIRS[0].main, STATUS_PAIRS[0].sub);
                statusTimer = setInterval(cycleStatus, MESSAGE_INTERVAL);

                // Restart progress animation
                if (progressRAF) cancelAnimationFrame(progressRAF);
                progressRAF = requestAnimationFrame(updateProgress);

                // Reload iframe
                const src = iframe.src;
                iframe.src = 'about:blank';
                setTimeout(() => {
                    iframe.src = src;
                }, 100);

                // Reset minTimer
                clearTimeout(minTimer);
                setTimeout(() => {
                    minTimeElapsed = true;
                    checkReady();
                }, MIN_LOADING_TIME);

                // Reset timeout
                clearTimeout(timeoutTimer);
                timeoutTimer = setTimeout(handleTimeout, IFRAME_TIMEOUT);
            });

            // ---------- Ready check ----------
            function checkReady() {
                if (iframeLoaded && minTimeElapsed && !accessGranted) {
                    accessGranted = true;
                    console.log('[NSQF] Loading complete.');

                    // Stop timers
                    clearInterval(statusTimer);
                    if (progressRAF) cancelAnimationFrame(progressRAF);

                    // Fill progress to 100%
                    progressFill.style.width = '100%';
                    progressPercent.textContent = '100%';
                    setStatus('Ready', 'Launching');

                    // Fade out overlay
                    setTimeout(() => {
                        overlay.classList.add('fade-out');
                        setTimeout(() => {
                            overlay.style.display = 'none';
                        }, FADE_DURATION);

                        // NOTE: The Download Notes button is intentionally NOT hidden
                        // here anymore — it floats above the app's bottom nav and stays
                        // available on every screen (login, launcher, modules).
                    }, 250);
                }
            }

            // ---------- Download Notes button ----------
            // Opens in a real browser tab (not an in-app iframe) so the device's
            // normal download flow works properly.
            notesBtn.addEventListener('click', () => {
                window.open(NOTES_URL, '_blank', 'noopener');
            });

            // ---------- Service worker (preserved) ----------
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('sw.js').catch(() => {});
                });
            }

            console.log('[NSQF] Modern loading overlay initialized.');
        })();
    </script>
</body>
</html>
